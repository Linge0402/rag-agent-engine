# 生产部署编排：Qdrant + vLLM（LLM 与 embedding 各一个服务）。
#
# 用法（需 NVIDIA GPU + nvidia-container-toolkit）：
#   cd deploy && docker compose up -d
# 然后把应用侧环境变量指向本编排（见 .env.example 的"部署期"注释段）：
#   RAE_LLM_BASE_URL=http://localhost:8000/v1  RAE_LLM_MODEL=Qwen/Qwen2.5-7B-Instruct
#   RAE_EMBEDDING_BASE_URL=http://localhost:8001/v1  RAE_EMBEDDING_MODEL=BAAI/bge-m3
#
# 注意：模型权重首次启动时从 HuggingFace 拉取（国内建议设 HF_ENDPOINT
# 镜像或预先挂载本地权重目录）。

services:
  qdrant:
    image: qdrant/qdrant:v1.15
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      retries: 5

  vllm-llm:
    image: vllm/vllm-openai:v0.11.0
    restart: unless-stopped
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --max-model-len 8192
      --gpu-memory-utilization 0.45
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-embed:
    image: vllm/vllm-openai:v0.11.0
    restart: unless-stopped
    command: >
      --model BAAI/bge-m3
      --task embed
      --max-model-len 8192
      --gpu-memory-utilization 0.15
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
  hf_cache:
