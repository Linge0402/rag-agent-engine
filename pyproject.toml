[project]
name = "rag-agent-engine"
version = "0.1.0"
description = "引擎 + 领域包架构的开源 Agentic RAG：核心引擎沉淀检索/评估/编排能力，领域包（legal/devdocs）插件化接入公开数据"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "packs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# RUF001/002/003（ambiguous unicode）与中文注释/文档字符串的全角标点冲突，本项目禁用
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
